# Theme clair fixe : les couleurs des graphiques sont validees contre cette
# surface, un basculement automatique en sombre les rendrait non conformes.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[server]
headless = true
